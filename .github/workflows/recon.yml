name: recon party pages
on:
  push:
    branches: [ccr-14311a87-fht1xv]
    paths: [".github/workflows/recon.yml", "tools/recon.py"]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: full
        run: python tools/recon.py full https://be-yahad.org.il/ https://beytenu.org.il/
      - name: yashar
        run: |
          python tools/recon.py og $(for s in gadi-eisenkot yoram-cohen orit-farkash adi-altschuler matan-kahana hili-tropper shaul-meridor tair-ifargan oshrat-gani-gonen shira-shapira inbar-harush-giti elazar-stern kamil-aburoken alex-rif inbar-yehezkeli roy-folkman israel-zari tal-ohana elisaf-peretz; do echo https://yasharwitheisenkot.com/team-member/$s/; done) "https://yasharwitheisenkot.com/team-member/%d7%93%d7%91%d7%95%d7%a8%d7%94-%d7%a9%d7%a8%d7%99%d7%a4%d7%99%d7%90%d7%9f-%d7%91%d7%9b%d7%a8/"
